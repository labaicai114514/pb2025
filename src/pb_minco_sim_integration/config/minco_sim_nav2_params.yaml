controller_server:
  ros__parameters:
    use_sim_time: True
    robot_base_frame: gimbal_yaw_fake
    odom_topic: odometry
    controller_frequency: 100.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.1
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 1000.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: "minco_controller::MincoMpcController"
      dt: 0.05
      lookahead_time: 0.6
      use_small_gyro_mode: false
      deadzone_speed_threshold: 0.05
      control_delay_compensation: 0.05
      Q: [4.0, 4.0, 2.0]
      R: [1.5, 1.5, 1.0]
      vx_min: -3.0
      vx_max: 3.0
      vy_min: -3.0
      vy_max: 3.0
      fixed_wz: 4.18
      omega_min: -5.0
      omega_max: 5.0
      use_acc_constraints: true
      ax_min: -3.0
      ax_max: 3.0
      ay_min: -3.0
      ay_max: 3.0
      alpha_min: -5.0
      alpha_max: 5.0
      lidar_offset_x: 0.0
      lidar_offset_y: -0.20
      lidar_roll_offset: 0.1745
      odom_frame: camera_init
      map_frame: map
      performance:
        enable: true
        print_enable: true
        detailed_csv_enable: false
        odom_sub_debug_enable: false
        mpc_csv_path: /tmp/mpc_perf_detailed.csv
        print_period_sec: 1.0
        csv_flush_every_n: 30
        run_id: ""
        scenario: "pb_simulation"
        variant: "mode_a"


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: gimbal_yaw_fake
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.3
      # ROGMap owns the dynamic 3D occupancy/projection layer in Mode A.
      # Keep Costmap2DROS as Nav2's compatibility surface and static map source.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.7
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: gimbal_yaw_fake
      robot_radius: 0.2
      resolution: 0.05
      track_unknown_space: true
      # Global PRIORMAP search reads this static Costmap2DROS. Dynamic 3D
      # observations are deliberately supplied by ROGMap instead.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.7
      always_send_full_costmap: False

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
map_server:
  ros__parameters:
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 10.0
    # 插件实例名须为 "GridBased": pb2025 BT XML (navigate_to_pose_w_replanning_and_recovery.xml)
    # 的 ComputePathToPose 硬编码 planner_id="GridBased", 名字不符会被 planner_server 拒绝
    # ("planner GridBased is not a valid planner. Planner names are: ..."), 目标必然失败
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "minco_planner/MincoPlanner"
      planner_mode: PRIORMAP
      frames:
        map_frame: map
        rog_frame: odom
      priormap:
        # Mode A: Nav2's static global costmap is the global search surface.
        use_nav2_global_search: true
        clip_seed_by_rog_boundary: true
        rog_boundary_margin: 0.2
        rog_boundary_sample_step: 0.1
      exploration:
        boundary_margin: 0.2
        boundary_sample_step: 0.1
        unknown_as_occupied: true
        prefer_goal_direction: true
      tolerance: 0.3
      use_smac: true
      allow_unknown: false
      # Planner pose/FSM state uses the odom-frame interface output.
      odom_topic: odometry
      lidar_offset_x: 0.0
      lidar_offset_y: -0.20
      performance:
        enable: false
        print_enable: false
        detailed_csv_enable: false
        odom_sub_debug_enable: false
        minco_csv_path: /tmp/minco_perf_detailed.csv
        print_period_sec: 1.0
        csv_flush_every_n: 30
        run_id: ""
        scenario: "pb_simulation"
        variant: "mode_a"
      rog_map:
        # Dynamic ROGMap is maintained in the loam_interface odom frame.
        frame_id: odom
        resolution: 0.08
        inflation_resolution: 0.05
        map_size: [10.0, 10.0, 1.5]
        fix_map_origin: [0.0, 0.0, 0.0]
        # Keep the legacy 3-D ESDF data structure disabled. MINCO's active
        # collision query uses the projection-backed 2-D field below.
        esdf:
          enable: true
          resolution: 0.20
          local_update_box: [10.0, 10.0, 2.0]
        load_pcd_en: false
        pcd_name: ""
        frontier_extraction_en: false
        point_filt_num: 2
        intensity_thresh: -1
        inflation_step: 1
        unk_inflation_en: false
        unk_inflation_step: 1
        virtual_ground_height: -0.80
        virtual_ceil_height: 1.80
        map_sliding:
          enable: true
          threshold: 0.2
          center_offset_enable: true
          center_offset: [0.0, 0.20, 0.0]
        ros_callback:
          enable: true
          cloud_topic: registered_scan
          odom_topic: lidar_odometry
          odom_timeout: 2.0
          update_period_ms: 30
        cloud_filter:
          enable: false
          z_offset: -1.0
          position_frame: map
          filter_mode: transform_center
          remove_inside: true
          log_stats: false
          stats_log_period_ms: 1000
          publish_visualization: false
          visualization_topic: /cloud_registered_crop_filter/markers
          visualization_period_ms: 200
          z_plane_size: 10.0
          z_plane_thickness: 0.03
          box_padding: 0.1
          position: {x: 0.0, y: 0.0, z: 0.0}
          box_size: {x: 12.0, y: 6.0, z: 3.5}
          # The parser validates these vectors even when the filter is disabled.
          # Keep one entry matching the single-box fallback above.
          positions: {x: [0.0], y: [0.0], z: [0.0]}
          box_sizes: {x: [12.0], y: [6.0], z: [3.5]}
        raycasting:
          enable: true
          batch_update_size: 1
          ray_range: [0.03, 10.0]
          local_update_box: [10.0, 10.0, 2.5]
          unk_thresh: 0.70
          p_hit: 0.9
          p_miss: 0.45
          p_min: 0.12
          p_max: 0.97
          p_occ: 0.85
          p_free: 0.499
          parallel_enable: false
          num_threads: 4
        decay:
          enable: true
          keep_time: 0.5
          clear_time: 1.2
          active_list_enable: false
        projection:
          enable: true
          prior_map:
            # Static prior is already provided by map_server/global_costmap.
            enable: false
            yaml_path: ""
            pgm_path: ""
            frame_id: map
          scan_z_min_abs: -0.20
          scan_z_max_abs: 1.5
          unknown_as_occupied: false
          min_observed_voxels: 2
          # 矮障碍判定收紧: ≤0.15m 才算薄面 (0.25m 以下的桩/减速带/矮护栏会隐身)
          surface_height_delta_max: 0.15
          # 0.35m 以上判墙; 0.15~0.35m 实心矮障碍落入 AMBIGUOUS_OCCUPIED(障碍)
          wall_height_delta_min: 0.35
          wall_occupancy_ratio_min: 0.80
          tunnel_height_delta_min: 0.26
          tunnel_height_delta_max: 0.60
          # 占空比 >0.4 的点位视为障碍, 防"稀疏观测的实心矮障碍"被当隧道偷跑
          tunnel_occupancy_ratio_max: 0.40
          passable_cost: 50
          passable_as_free: true
          hysteresis_enable: false
          hysteresis_count: 2
          obstacle_hold_time: 1.5
          mask_filter_en: true
          fill_occ_min: 8
          denoise_occ_max: 0
        field:
          enable: true
          inflation_radius: 0.3
          max_distance: 6.0
          min_distance: -3.0
          clamp_distance: true
          interpolation: quadratic
          update_rate: 10.0
        performance:
          enable: false
          field_update_rate: 20.0
          detailed_csv_enable: false
          summary_csv_enable: false
          detailed_csv_path: /tmp/rog_map_perf_detailed.csv
          summary_csv_path: /tmp/rog_map_perf_summary.csv
          run_id: ""
          scenario: "pb_simulation"
          variant: "mode_a"
          csv_flush_every_n: 30
          print_enable: false
          summary_rate: 1.0
          dirty_column_enable: true
          dirty_full_ratio: 0.30
          parallel_raycast_enable: false
          raycast_num_threads: 4
        visualization:
          enable: true
          frame_id: odom
          rate: 5.0
          range: [10.0, 10.0, 1.5]
        debug:
          layer_pub_enable: false
          field_pub_enable: false
          pub_rate: 5.0
      corridor:
        robot_radius: 0.3
        extra_margin: 0.05
      smac_2d:
        use_esdf_cost: false
        esdf_weight: 1.0
        esdf_decay: 0.8
        esdf_max_cost: 0.5
      minco_optimizer:
        opt_freq: 20.0
        traj_goal_tolerance: 0.3
        enable_yaw_opt: true
        safe_dist: 0.35
        collision_dist: 0.2
        # 弯道调优: 观察窗加长, 避免轨迹在弯道中间被截断
        lookahead_dist: 8.0
        max_velocity: 2.0
        # 大曲率弯道调优: r_min = v^2/a, v=2.0 时 a=3.0 -> r_min≈1.33m (原 2.0 -> 4.5m/2.0m)
        max_acceleration: 3.0
        max_yaw_dot: 5.0
        turn_angle_deadzone: 0.1
        turn_angle_saturation: 0.8
        min_turn_vel: 0.7
        decay_power: 1.6
        time_allocation_iters: 15
        smooth_eps: 0.01
        integral_res: 16
        opt_accuracy: 0.001
        print_optimizer_log: false
        # 弯道调优: 提高时间惩罚让优化器"愿意"在弯道减速 (否则削角贴墙-不可行)
        penalty_weight_time: 300.0
        penalty_weight_pos: 50000.0
        penalty_weight_vel: 1500.0
        penalty_weight_acc: 1500.0
        penalty_weight_att: 100.0
        penalty_weight_time_barrier: 50.0
      recovery_server:
        fail_threshold: 5
        cooldown_sec: 1.0
        recovery_window_sec: 3.0
        escape_speed: 0.5

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "pb_nav2_behaviors/BackUpFreeSpace"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: gimbal_yaw_fake
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    # params for pb_nav2_behaviors/BackUpFreeSpace
    service_name: "global_costmap/get_costmap"
    max_radius: 2.0
    visualize: false

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.5, 2.5, 3.0]
    min_velocity: [-2.5, -2.5, -3.0]
    max_accel: [4.5, 4.5, 5.0]
    max_decel: [-4.5, -4.5, -5.0]
    odom_topic: "odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

pb_teleop_twist_joy_node:
  ros__parameters:
    use_sim_time: True
    robot_base_frame: gimbal_yaw
    control_mode: auto_control    # Option: auto_control, manual_control

    require_enable_button: true
    enable_button: 4              # L1 shoulder button
    enable_turbo_button: 5        # R1 shoulder button

    axis_chassis:
      x: 1                        # Left thumb stick vertical
      y: 0                        # Left thumb stick horizontal
      yaw: 6                      # button_left and button_right
    scale_chassis:
      x: 2.5
      y: 2.5
      yaw: 3.0
    scale_chassis_turbo:
      x: 4.0
      y: 4.0
      yaw: 6.0

    axis_gimbal:
      roll: -1                    # Disable
      pitch: 4                    # Right thumb stick vertical
      yaw: 3                      # Right thumb stick horizontal
    scale_gimbal:
      roll: 0.0
      pitch: -1.0
      yaw: 2.5
    scale_gimbal_turbo:
      roll: 0.0
      pitch: -1.5
      yaw: 3.5
